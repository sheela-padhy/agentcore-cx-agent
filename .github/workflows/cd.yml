name: CD

on:
  push:
    branches: [ main ]
    paths:
      - 'cx-agent-backend/**'
      - '.github/workflows/cd.yml'

permissions:
  id-token: write   # required for OIDC - lets this workflow request a temporary AWS identity
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: langgraph-cx-agent
  AGENT_RUNTIME_ID: langgraph_cx_agent-6oVCIK724N
  AGENT_EXECUTION_ROLE_ARN: arn:aws:iam::504736193889:role/agentic-ai-bedrock-role
  DEFAULT_MODEL: global.anthropic.claude-sonnet-4-6

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Assume AWS role via OIDC (no stored credentials)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::504736193889:role/github-actions-cx-agent-cd
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag to the commit SHA
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # GitHub's standard runners are x86_64, but AgentCore Runtime (and this
      # project's EC2 build box, a Graviton/ARM64 instance) needs an ARM64
      # image - these two steps set up emulation so an ARM64 image can be
      # built on an x86 machine (slower than native, but works reliably
      # without needing a special ARM-hosted runner).
      - name: Set up QEMU (for cross-platform ARM64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: cx-agent-backend
        run: |
          docker buildx build --platform linux/arm64 --load \
            -t ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }} \
            .

      - name: Push image to ECR
        run: |
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}

      - name: Install boto3
        # bedrock-agentcore-control is a very new AWS service; older
        # botocore versions (what a bare "pip install boto3" can resolve to
        # on a fresh runner) don't have its service model yet and raise
        # UnknownServiceError. Force the latest to make sure it's included.
        run: pip install --upgrade boto3 botocore

      - name: Redeploy the Agent Runtime with the new image
        run: |
          python3 << 'EOF'
          import boto3, time, os

          region = os.environ["AWS_REGION"]
          runtime_id = os.environ["AGENT_RUNTIME_ID"]
          image_uri = "${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}"
          execution_role_arn = os.environ["AGENT_EXECUTION_ROLE_ARN"]

          client = boto3.client("bedrock-agentcore-control", region_name=region)

          current = client.get_agent_runtime(agentRuntimeId=runtime_id)
          env_vars = current.get("environmentVariables", {})
          # DEFAULT_MODEL is set explicitly here (from this workflow file),
          # not just carried forward - this makes the model a real,
          # version-controlled setting instead of untracked Runtime state.
          env_vars["DEFAULT_MODEL"] = os.environ["DEFAULT_MODEL"]
          print("Setting DEFAULT_MODEL to " + env_vars["DEFAULT_MODEL"])

          print(f"Deploying {image_uri} to {runtime_id} ...")
          client.update_agent_runtime(
              agentRuntimeId=runtime_id,
              roleArn=execution_role_arn,
              agentRuntimeArtifact={
                  "containerConfiguration": {"containerUri": image_uri}
              },
              networkConfiguration={"networkMode": "PUBLIC"},
              protocolConfiguration={"serverProtocol": "HTTP"},
              environmentVariables=env_vars,
          )

          for _ in range(30):
              status = client.get_agent_runtime(agentRuntimeId=runtime_id)["status"]
              print(f"  status: {status}")
              if status == "READY":
                  print("Deployment successful.")
                  break
              if status in ("CREATE_FAILED", "UPDATE_FAILED"):
                  raise SystemExit(f"Deployment failed with status {status}")
              time.sleep(10)
          else:
              raise SystemExit("Timed out waiting for Runtime to become READY")
          EOF

      - name: Notify Slack of deployment result
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 << 'EOF'
          import json, os, urllib.request

          status = os.environ["JOB_STATUS"]
          emoji = "\u2705" if status == "success" else "\u274C"
          word = "succeeded" if status == "success" else "FAILED"
          short_sha = os.environ["COMMIT_SHA"][:7]

          text = (
              emoji + " Deployment " + word + ": `" + short_sha + "` "
              + os.environ.get("COMMIT_MSG", "").splitlines()[0] + "\n"
              + os.environ["RUN_URL"]
          )
          data = json.dumps({"text": text}).encode()
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req)
          EOF
