name: Terraform Apply

# Deliberately manual-only - no automatic trigger. Infrastructure changes
# are higher-stakes than application code (can cost money, delete real
# resources), so unlike the app's CD pipeline, this never runs on its own.
# Go to Actions tab -> Terraform Apply -> Run workflow, after reviewing
# the plan from a merged PR.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_bedrock_role_name: ${{ secrets.TF_VAR_BEDROCK_ROLE_NAME }}
      TF_VAR_user_pool_name: ${{ secrets.TF_VAR_USER_POOL_NAME }}
      TF_VAR_kb_stack_name: ${{ secrets.TF_VAR_KB_STACK_NAME }}
      TF_VAR_kb_bucket_name: ${{ secrets.TF_VAR_KB_BUCKET_NAME }}
      TF_VAR_gateway_url: ${{ secrets.TF_VAR_GATEWAY_URL }}
      TF_VAR_gateway_api_key: ${{ secrets.TF_VAR_GATEWAY_API_KEY }}
      TF_VAR_tavily_api_key: ${{ secrets.TF_VAR_TAVILY_API_KEY }}
      TF_VAR_langfuse_public_key: ${{ secrets.TF_VAR_LANGFUSE_PUBLIC_KEY }}
      TF_VAR_langfuse_secret_key: ${{ secrets.TF_VAR_LANGFUSE_SECRET_KEY }}
      TF_VAR_langfuse_host: ${{ secrets.TF_VAR_LANGFUSE_HOST }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assume AWS role via OIDC (no stored credentials)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::504736193889:role/github-actions-cx-agent-terraform
          aws-region: us-west-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false -no-color

      - name: Notify Slack of apply result
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 << 'EOF'
          import json, os, urllib.request

          status = os.environ["JOB_STATUS"]
          emoji = "✅" if status == "success" else "❌"
          word = "succeeded" if status == "success" else "FAILED"

          text = (
              emoji + " Terraform apply " + word + " (manual trigger)\n"
              + os.environ["RUN_URL"]
          )
          data = json.dumps({"text": text}).encode()
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req)
          EOF
