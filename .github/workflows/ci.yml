name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  notify-pr-opened:
    # Only fires when the PR is first created, not on every follow-up push
    # to it (that would spam Slack with one message per commit).
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          python3 << 'EOF'
          import json, os, urllib.request

          text = (
              "\U0001F514 New Pull Request opened: *" + os.environ["PR_TITLE"] + "*\n"
              "By " + os.environ["PR_AUTHOR"] + " -> " + os.environ["PR_URL"]
          )
          data = json.dumps({"text": text}).encode()
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req)
          EOF

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cx-agent-backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff lint check
        run: uv run ruff check .

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cx-agent-frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff lint check
        run: uv run ruff check .
